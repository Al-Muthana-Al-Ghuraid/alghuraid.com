title:
  en: RAG-powered AI chatbot on Azure
  ar: روبوت محادثة ذكي بتقنية RAG على Azure
summary:
  en: "A chatbot that answers questions from a library of PDF documents using retrieval-augmented generation, built as a team capstone. We deployed it on two different Azure architectures, autoscaling VM Scale Sets and Kubernetes on AKS, all defined in Terraform and shipped through GitHub Actions."
  ar: "روبوت محادثة يجيب عن الأسئلة من مكتبة مستندات PDF بتقنية التوليد المعزّز بالاسترجاع (RAG)، بنيناه مشروعَ تخرج جماعيًا، ونشرناه على معماريتين مختلفتين في Azure: مجموعات أجهزة افتراضية ذاتية التوسع (VM Scale Sets)، وKubernetes عبر AKS، وكل ذلك معرَّف في Terraform ويُنشَر عبر GitHub Actions."
impact:
  en: "Same app, two architectures: autoscaling VMs vs Kubernetes · infrastructure in Terraform · CI/CD with GitHub Actions"
  ar: "التطبيق نفسه بمعماريتين: أجهزة افتراضية ذاتية التوسع مقابل Kubernetes · البنية التحتية في Terraform · تكامل ونشر مستمر عبر GitHub Actions"
caseStudy:
  intro:
    en: "The team capstone of my WeCloudData Cloud Engineering bootcamp. The chatbot was the vehicle; the real subject was cloud engineering: designing, automating and comparing two production-style ways to run the same AI application on Azure."
    ar: "مشروع التخرج الجماعي في معسكر هندسة السحابة من WeCloudData. كان روبوت المحادثة هو الوسيلة، أما الموضوع الحقيقي فهندسة السحابة: تصميم طريقتين لتشغيل تطبيق الذكاء الاصطناعي نفسه على Azure بمستوى بيئات الإنتاج، وأتمتتهما، والمقارنة بينهما."
  problem:
    en: "Teams keep their knowledge in long PDF documents that are hard to search. A language model on its own will answer confidently but not from those documents. We needed answers grounded in the source files, running on infrastructure that scales with demand, keeps secrets safe and can be rebuilt from code at any time."
    ar: "تحتفظ الفرق بمعرفتها في مستندات PDF طويلة يصعب البحث فيها، والنموذج اللغوي وحده يجيب بثقة لكن ليس من تلك المستندات. احتجنا إلى إجابات مستندة إلى الملفات المصدرية، تعمل على بنية تتوسع مع الطلب، وتحفظ الأسرار، ويمكن إعادة بنائها من الرمز في أي وقت."
  built:
    - en: "A retrieval-augmented generation service: documents are split into chunks and embedded, the most relevant passages are retrieved for each question, and the OpenAI API writes an answer grounded in them. FastAPI serves the backend and Streamlit the chat interface."
      ar: "خدمة توليد معزّز بالاسترجاع: تُقسَّم المستندات إلى مقاطع وتُحوَّل إلى متجهات، ويُسترجَع أنسب المقاطع لكل سؤال، ثم تكتب OpenAI API إجابة مستندة إليها. تخدم FastAPI الواجهة الخلفية، وStreamlit واجهة المحادثة."
    - en: "Architecture one: VM Scale Sets behind a load balancer that add or remove instances based on CPU and memory usage."
      ar: "المعمارية الأولى: مجموعات أجهزة افتراضية (VM Scale Sets) خلف موازن أحمال، تضيف النسخ أو تزيلها بحسب استهلاك المعالج والذاكرة."
    - en: "Architecture two: containerized services on Azure Kubernetes Service, with images built and stored in Azure Container Registry."
      ar: "المعمارية الثانية: خدمات في حاويات على Azure Kubernetes Service، مع صور تُبنى وتُخزَّن في Azure Container Registry."
    - en: "Blob Storage for the source documents, Cosmos DB for application data, and Key Vault for API keys and connection strings."
      ar: "Blob Storage للمستندات المصدرية، وCosmos DB لبيانات التطبيق، وKey Vault لمفاتيح الـAPI وسلاسل الاتصال."
    - en: "Everything defined in Terraform and deployed through GitHub Actions pipelines, so the whole environment can be recreated from the repository."
      ar: "كل شيء معرَّف في Terraform ويُنشَر عبر خطوط GitHub Actions، فيمكن إعادة إنشاء البيئة كاملة من المستودع."
  decisions:
    - en: "Two architectures instead of one, to compare the trade-offs first-hand: VM Scale Sets are simpler to reason about and scale whole machines, while Kubernetes packs services more tightly and scales them independently, at the cost of more moving parts."
      ar: "معماريتان بدل واحدة لمقارنة المفاضلات عن قرب: VM Scale Sets أبسط في الفهم وتتوسع بأجهزة كاملة، بينما يجمع Kubernetes الخدمات بكثافة أعلى ويوسّع كل خدمة على حدة، مقابل عدد أكبر من المكونات."
    - en: "Secrets in Key Vault, never in code or pipeline files, so the repository could be shared safely."
      ar: "الأسرار في Key Vault، لا في الرمز ولا في ملفات خطوط النشر، ليكون المستودع آمنًا للمشاركة."
    - en: "Infrastructure as code from day one, so any environment could be torn down and rebuilt identically instead of fixed by hand."
      ar: "البنية التحتية كرمز منذ اليوم الأول، فيمكن هدم أي بيئة وإعادة بنائها مطابقة بدل إصلاحها يدويًا."
  results:
    - en: "A working chatbot that answers from the document library, deployed and running on both architectures."
      ar: "روبوت محادثة عامل يجيب من مكتبة المستندات، منشور ويعمل على المعماريتين."
    - en: "Hands-on experience with the full path from code to cloud: containers, autoscaling, Kubernetes, Terraform, CI/CD and secret management."
      ar: "خبرة عملية في المسار الكامل من الرمز إلى السحابة: الحاويات، والتوسع التلقائي، وKubernetes، وTerraform، وCI/CD، وإدارة الأسرار."
  stats:
    - { value: "2", label: { en: deployment architectures, ar: معماريتان للنشر } }
    - { value: "Auto", label: { en: scaling on CPU and memory, ar: توسع تلقائي حسب المعالج والذاكرة } }
