caseStudy:
  intro:
    en: "My capstone for the Saudi Digital Academy software development bootcamp. As team lead, I ran our planning meetings, turned the team's ideas into a feature plan, and took the platform from an empty repository to a working product across four role-based workspaces."
    ar: "مشروع تخرجي في معسكر تطوير البرمجيات من الأكاديمية السعودية الرقمية. بصفتي قائد الفريق، أدرت اجتماعات التخطيط، وحوّلت أفكار الفريق إلى خطة ميزات واضحة، وأخذت المنصة من مستودع فارغ إلى منتج عامل بأربع مساحات عمل حسب الدور."
  problem:
    en: "A bootcamp runs on more than lectures. Staff juggle cohorts, weekly content, quizzes, attendance, office hours and students who start to slip, usually across separate tools. Instructors lose time to admin, and by the time someone notices a struggling student, weeks have passed."
    ar: "لا يقوم المعسكر التدريبي على المحاضرات وحدها؛ فالفريق يتعامل مع الدفعات والمحتوى الأسبوعي والاختبارات والحضور والساعات المكتبية والطلاب الذين بدأوا يتعثرون، غالبًا عبر أدوات متفرقة. فيضيع وقت المدرّبين في الأعمال الإدارية، وحين يُلاحَظ تعثّر طالب تكون أسابيع قد مضت."
  built:
    - en: "A help-session booking engine. Instructors define recurring office hours once and the system generates bookable slots, warns them when a slot overlaps their teaching hours, allows one active booking per student, and blocks students automatically after repeated no-shows."
      ar: "محرّك لحجز جلسات الدعم: يحدد المدرّب ساعاته المكتبية المتكررة مرة واحدة، فيولّد النظام مواعيد قابلة للحجز، وينبّهه عند تعارض أي موعد مع ساعات تدريسه، ويسمح لكل طالب بحجز نشط واحد، ويحظر تلقائيًا من يتكرر غيابه عن مواعيده."
    - en: "Time-aware learning. The current week is calculated from each cohort's start date, content unlocks week by week, and quiz deadlines are enforced on the server, not just hidden in the interface."
      ar: "تعلّم مرتبط بالزمن: يُحسَب الأسبوع الحالي من تاريخ بدء كل دفعة، ويُتاح المحتوى أسبوعًا بعد أسبوع، وتُفرَض مواعيد الاختبارات على الخادم لا بإخفائها في الواجهة فحسب."
    - en: "Live progress dashboards that combine content completion, quiz scores, assignment grades and attendance for every student, so instructors can see who needs help at a glance."
      ar: "لوحات تقدّم حيّة تجمع إنجاز المحتوى ودرجات الاختبارات والواجبات والحضور لكل طالب، ليرى المدرّب من يحتاج إلى المساعدة بنظرة واحدة."
    - en: "A risk register for at-risk students, with the cohort's programme manager filled in as the owner, so every flag has someone accountable for following up."
      ar: "سجل مخاطر للطلاب المعرّضين للتعثر، يُعيَّن فيه مدير برنامج الدفعة مالكًا للخطر تلقائيًا، فيكون لكل تنبيه مسؤول عن متابعته."
    - en: "Full cohort lifecycle: create, duplicate a cohort's courses for the next intake without its students, manage a waitlist, and archive a finished cohort in one step."
      ar: "دورة حياة كاملة للدفعة: إنشاؤها، ونسخ مقرراتها للدفعة التالية دون طلابها، وإدارة قائمة الانتظار، وأرشفة الدفعة المنتهية بخطوة واحدة."
    - en: "Around it: announcements, a Q&A forum, articles and quizzes authored by instructors, career profiles, and a calendar, all behind JWT login with bcrypt-hashed passwords and role checks on the API."
      ar: "وحولها: إعلانات، ومنتدى للأسئلة، ومقالات واختبارات يكتبها المدرّبون، وملفات للمسار المهني، وتقويم؛ وكل ذلك خلف تسجيل دخول بـJWT مع كلمات مرور مُجزّأة بـbcrypt وتحقق من الصلاحيات على مستوى الـAPI."
  decisions:
    - en: "Fair attendance by design: a late arrival counts as half, and excused absences are left out of the total, so the percentage reflects commitment rather than circumstances."
      ar: "حضور عادل بالتصميم: يُحتسب التأخر نصف حضور، وتُستبعد الغيابات بعذر من الإجمالي، فتعكس النسبة التزام الطالب لا ظروفه."
    - en: "Rules live on the server. Deadlines, booking limits and permissions are checked by the API, so the interface can stay simple without being the only line of defence."
      ar: "القواعد على الخادم: تتحقق الـAPI من المواعيد النهائية وحدود الحجز والصلاحيات، فتبقى الواجهة بسيطة دون أن تكون خط الدفاع الوحيد."
    - en: "Risk management built in, not bolted on: every at-risk flag gets an owner from day one, the same way a project risk register works."
      ar: "إدارة المخاطر جزء من التصميم لا إضافة لاحقة: يحصل كل تنبيه على مالك منذ اللحظة الأولى، تمامًا كما يعمل سجل المخاطر في المشاريع."
  challenges:
    - en: "The progress dashboard slowed down as cohorts grew, because it ran around ten database queries per student. I rewrote it to load the whole cohort in a fixed number of bulk queries, so it stays fast no matter how many students there are."
      ar: "تباطأت لوحة التقدّم مع كبر الدفعات لأنها كانت تنفّذ نحو عشرة استعلامات لكل طالب، فأعدت كتابتها لتجلب بيانات الدفعة كاملة بعدد ثابت من الاستعلامات المجمّعة، فتبقى سريعة مهما زاد عدد الطلاب."
    - en: "Scheduling edge cases: recurring versus one-off sessions, overlaps with teaching hours, double bookings and no-shows all needed explicit rules before the booking flow felt trustworthy."
      ar: "حالات الجدولة الحدّية: احتاجت الجلسات المتكررة مقابل الفردية، والتعارض مع ساعات التدريس، والحجز المزدوج، والغياب عن الموعد، إلى قواعد صريحة قبل أن يصبح الحجز موثوقًا."
  results:
    - en: "The bootcamp team praised the platform and said it improved on many aspects of the learning management system they use today."
      ar: "أشاد فريق المعسكر بالمنصة، وأكدوا أنها حسّنت جوانب عدة في نظام إدارة التعلّم الذي يستخدمونه حاليًا."
    - en: "A working product covering the full bootcamp lifecycle, from cohort creation to career profiles, delivered within the bootcamp timeline."
      ar: "منتج عامل يغطي دورة حياة المعسكر كاملة، من إنشاء الدفعة إلى ملفات المسار المهني، سُلِّم ضمن الجدول الزمني للمعسكر."
