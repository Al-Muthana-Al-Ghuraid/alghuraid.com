title:
  en: "TrackFlow: bootcamp management platform"
  ar: "TrackFlow: منصة لإدارة المعسكرات التدريبية"
summary:
  en: "A full-stack platform for running training cohorts end to end: courses that unlock week by week, quizzes and assignments, attendance, one-to-one help sessions, live progress tracking and a risk register for students who fall behind. I led the team and owned the technical delivery."
  ar: "منصة متكاملة لإدارة الدفعات التدريبية من البداية إلى النهاية: محتوى يُتاح أسبوعًا بعد أسبوع، واختبارات وواجبات، وحضور، وجلسات دعم فردية، ومتابعة حيّة للتقدّم، وسجل مخاطر للطلاب المتعثرين. قُدت الفريق وتولّيت التنفيذ التقني."
impact:
  en: "Team lead · praised by the bootcamp for improving on the LMS they use · booking engine and live progress dashboards"
  ar: "قائد الفريق · أشادت به إدارة المعسكر لتحسينه جوانب عدة في نظام إدارة التعلّم لديهم · محرّك حجوزات ولوحات تقدّم حيّة"
