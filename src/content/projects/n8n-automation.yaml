title:
  en: Self-hosted job-hunt automation on Oracle Cloud
  ar: منصة أتمتة للبحث عن الوظائف على Oracle Cloud
summary:
  en: "An automation platform I designed and run on Oracle Cloud: n8n in Docker, reachable only through Cloudflare Zero Trust. Every morning it collects posts from four job boards, merges duplicates, filters them against my profile and ranks the best matches, with AI reading each post and clear rules making the decision."
  ar: "منصة أتمتة صمّمتها وأديرها على Oracle Cloud: تعمل n8n داخل Docker، ولا يُوصَل إليها إلا عبر Cloudflare Zero Trust. كل صباح تجمع الإعلانات من أربع منصات توظيف، وتدمج المكرر منها، وتفرزها وفق ملفي المهني، ثم ترتّب أنسبها؛ يقرأ الذكاء الاصطناعي كل إعلان، وتحسم القواعد الواضحة القرار."
impact:
  en: "~1,000 posts in → ~80 ranked matches every morning · AI reads, rules decide · zero open ports"
  ar: "~1,000 إعلان يوميًا ← ~80 فرصة مرتّبة كل صباح · الذكاء الاصطناعي يقرأ والقواعد تحسم · لا منافذ مفتوحة"
caseStudy:
  diagram: n8n
  intro:
    en: "I took a job search that lived in browser tabs and turned it into a pipeline that runs before I wake up. It is also where I put cloud, security and automation into practice on a system I depend on every day: a hardened Oracle Cloud server, a zero-trust front door, scheduled runs and nightly backups."
    ar: "حوّلت بحثًا عن الوظائف كان يعيش في تبويبات المتصفح إلى خط معالجة يعمل قبل أن أستيقظ. وهو أيضًا المكان الذي طبّقت فيه السحابة والأمن والأتمتة على نظام أعتمد عليه يوميًا: خادم مُحصَّن على Oracle Cloud، وبوابة دخول بنموذج Zero Trust، وتشغيل مجدول، ونسخ احتياطي كل ليلة."
  problem:
    en: "Checking LinkedIn, Indeed, Bayt and Workable by hand took hours a day. The same job appeared on several boards under slightly different names, most posts did not fit my profile, and good ones went stale while I sorted through the rest. My first automations ran on my laptop, so they stopped whenever it was off."
    ar: "كانت متابعة LinkedIn وIndeed وBayt وWorkable يدويًا تستهلك ساعات كل يوم؛ فالوظيفة نفسها تظهر في أكثر من منصة بمسميات متقاربة، وأغلب الإعلانات لا تناسب ملفي، والفرص الجيدة تفوت وأنا أفرز البقية. وكانت أولى محاولاتي للأتمتة تعمل على حاسوبي، فتتوقف كلما أُغلق."
  built:
    - en: "One standard format for four sources. Each board returns data in its own shape; the pipeline cleans HTML, normalizes dates, salaries, companies and titles, so every later step works on the same fields."
      ar: "صيغة موحّدة لأربعة مصادر: تعيد كل منصة بياناتها بشكل مختلف، فيتولى خط المعالجة تنظيف HTML وتوحيد التواريخ والرواتب وأسماء الشركات والمسميات، لتعمل كل خطوة لاحقة على الحقول نفسها."
    - en: "Two-layer duplicate detection. First by each platform's own job ID read from the link, then by a normalized title-and-company signature that ignores suffixes like \"LLC\" or \"شركة\". Both are checked against every job ever accepted or rejected, so a re-run never adds the same job twice."
      ar: "كشف للتكرار على مستويين: أولًا بمعرّف الوظيفة الخاص بكل منصة كما يظهر في الرابط، ثم ببصمة موحّدة للمسمى واسم الشركة تتجاهل لواحق مثل \"LLC\" و\"شركة\". ويُقارَن الاثنان بكل وظيفة قُبلت أو رُفضت سابقًا، فلا تُضاف الوظيفة مرتين مهما أُعيد التشغيل."
    - en: "A bilingual rules layer tuned to my profile. Titles in English and Arabic are routed in one pass: clear mismatches are dropped with a logged reason, clear fits pass straight through, and only the ambiguous ones go to the AI."
      ar: "طبقة قواعد ثنائية اللغة مضبوطة على ملفي المهني: تُوجَّه المسميات العربية والإنجليزية في مرور واحد؛ فيُستبعد غير المناسب بوضوح مع تسجيل السبب، ويمر المناسب بوضوح مباشرة، ولا يُحال إلى الذكاء الاصطناعي إلا ما يحتمل أكثر من تفسير."
    - en: "AI that reads, rules that decide. The model only extracts facts from the post (role type, years required and similar) as structured JSON; plain code applies my criteria to those facts. Every verdict is consistent, explainable and easy to tune."
      ar: "ذكاء اصطناعي يقرأ، وقواعد تحسم: يقتصر دور النموذج على استخراج الحقائق من الإعلان (نوع الدور، وسنوات الخبرة المطلوبة وما شابه) بصيغة JSON منظّمة، ثم تطبّق شيفرة واضحة معاييري على تلك الحقائق؛ فيأتي كل حكم متّسقًا وقابلًا للتفسير وسهل الضبط."
    - en: "Ranking with a feedback loop. Each job is scored on fit and location; my own marks on past companies nudge future scores. The top tier gets a tailored cover letter and the CV version that matches the role, and stale posts are dropped automatically."
      ar: "ترتيب مع حلقة تغذية راجعة: تُقيَّم كل وظيفة حسب ملاءمتها وموقعها، وتؤثر تقييماتي السابقة للشركات في التقييمات اللاحقة. وتحصل الفئة الأعلى على خطاب تقديم مُخصَّص ونسخة السيرة الذاتية المناسبة للدور، وتُستبعد الإعلانات القديمة تلقائيًا."
    - en: "The platform underneath: an ARM server on Oracle Cloud running n8n and cloudflared with Docker Compose, no app ports published, nightly backups of workflows and encrypted credentials with 14-day retention, plus a monthly off-server copy."
      ar: "المنصة من الأسفل: خادم ARM على Oracle Cloud يشغّل n8n وcloudflared عبر Docker Compose دون نشر أي منفذ للتطبيق، مع نسخ احتياطي ليلي لسير العمل وبيانات الاعتماد المشفّرة يُحتفظ به 14 يومًا، ونسخة شهرية خارج الخادم."
  decisions:
    - en: "Oracle Cloud, on purpose. Its ARM instances are a strong fit for an always-on container workload, and I wanted real hands-on experience with a second major cloud alongside Azure. Running something I rely on daily taught me far more than a lab would."
      ar: "Oracle Cloud عن قصد: خوادم ARM لديها مناسبة جدًا لحاويات تعمل على مدار الساعة، وأردت خبرة عملية حقيقية مع منصة سحابية كبرى ثانية إلى جانب Azure. وتشغيل نظام أعتمد عليه يوميًا علّمني أكثر بكثير مما يعلّمه أي مختبر تجريبي."
    - en: "Cloudflare Tunnel and Access instead of opening ports. The server makes an outbound connection only, so there is nothing to scan from the internet. Getting in takes an email PIN for one allowed address, then n8n's own login: two independent locks."
      ar: "Cloudflare Tunnel وAccess بدل فتح المنافذ: لا يُنشئ الخادم إلا اتصالًا صادرًا، فلا يوجد ما يمكن مسحه من الإنترنت. ويتطلب الدخول رمزًا عبر البريد لعنوان واحد مسموح به، ثم تسجيل الدخول الخاص بـn8n؛ أي قفلين مستقلين."
    - en: "Rules before AI. Cheap, predictable checks handle the obvious cases, so the model is only asked about the posts where judgment is actually needed. Every rejection is logged with its reason, which makes the filter tunable instead of a black box."
      ar: "القواعد قبل الذكاء الاصطناعي: تتولى فحوص بسيطة ومتوقَّعة الحالات الواضحة، فلا يُسأل النموذج إلا عن الإعلانات التي تحتاج فعلًا إلى تقدير. ويُسجَّل كل رفض مع سببه، فيصبح الفلتر قابلًا للضبط لا صندوقًا أسود."
  challenges:
    - en: "Google OAuth tokens expired every 7 days while the app was in \"Testing\" mode. Moving the consent screen to production fixed it for good."
      ar: "كانت رموز Google OAuth تنتهي كل 7 أيام ما دام التطبيق في وضع الاختبار، وحُلّت المشكلة نهائيًا بنقل شاشة الموافقة إلى وضع الإنتاج."
    - en: "Re-runs created duplicate rows, and the same job reposted by different recruiters slipped through. The two-layer check against full history solved both."
      ar: "كانت إعادة التشغيل تُنشئ صفوفًا مكررة، وكانت الوظيفة نفسها تتسلل حين يعيد نشرها أكثر من مُوظِّف، فعالج التحقق على مستويين مقابل السجل الكامل المشكلتين معًا."
    - en: "Every board formats things differently, from salary objects to Arabic company names. Normalizing once at the start kept the rest of the pipeline simple."
      ar: "لكل منصة طريقتها في تنسيق البيانات، من كائنات الرواتب إلى أسماء الشركات العربية، فكان التوحيد مرة واحدة في البداية كفيلًا بإبقاء بقية خط المعالجة بسيطًا."
  results:
    - en: "The search now runs itself every morning in the cloud. I start the day with a ranked shortlist instead of hours of scrolling."
      ar: "أصبح البحث يعمل تلقائيًا كل صباح في السحابة، فأبدأ يومي بقائمة مرتّبة بدل ساعات من التصفح."
    - en: "About 1,000 posts in, about 80 ranked matches out, with no duplicates across runs and a clear reason recorded for every job left out."
      ar: "نحو 1,000 إعلان تدخل، ونحو 80 فرصة مرتّبة تخرج، دون أي تكرار بين عمليات التشغيل، ومع سبب واضح مسجَّل لكل وظيفة مستبعدة."
    - en: "A production-style setup I run and maintain myself: zero-trust access, no open ports, scheduled jobs and nightly backups."
      ar: "بيئة بمستوى الإنتاج أشغّلها وأصونها بنفسي: وصول بنموذج Zero Trust، ولا منافذ مفتوحة، ومهام مجدولة، ونسخ احتياطي كل ليلة."
