name: Entrepreneurship Program
provider: Misk Foundation
hours: 50
skills: [Problem validation, Business model, Financial basics, Pitching]
summary:
  en: "Turning an idea into a viable business: validating the problem, building a business model, financial basics and pitching. I developed a startup concept for an app serving people with disabilities, taking it from problem discovery to a pitch-ready model."
  ar: "تحويل الفكرة إلى مشروع قابل للحياة: التحقق من المشكلة، وبناء نموذج العمل، وأساسيات الإدارة المالية، والعرض أمام المستثمرين. وطوّرت فكرة مشروع ناشئ لتطبيق يخدم الأشخاص ذوي الإعاقة، من اكتشاف المشكلة حتى نموذج جاهز للعرض."
