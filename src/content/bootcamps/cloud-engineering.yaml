summary:
  en: "500 hours of hands-on cloud engineering on Microsoft Azure: designing networks and compute, writing infrastructure as code with Terraform, containerizing apps with Docker, running them on Kubernetes, automating delivery with GitHub Actions, and securing it all with proper identity and secret management. The capstone deployed an AI chatbot on two architectures side by side."
  ar: "500 ساعة من هندسة السحابة العملية على Microsoft Azure: تصميم الشبكات والموارد الحاسوبية، وكتابة البنية التحتية كرمز بـTerraform، ووضع التطبيقات في حاويات Docker وتشغيلها على Kubernetes، وأتمتة النشر بـGitHub Actions، وتأمين ذلك كله بإدارة سليمة للهويات والأسرار. وفي مشروع التخرج نشرنا روبوت محادثة ذكيًا على معماريتين جنبًا إلى جنب."
