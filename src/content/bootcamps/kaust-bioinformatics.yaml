order: 3
name: Advanced Bioinformatics Training Program
provider: KAUST Academy
hours: 120
mode: in-person
skills: [Python, pandas, Data normalization, Correlation analysis, Genomic data]
selective:
  en: "Selective admission: entry exam"
  ar: قبول تنافسي عبر اختبار قبول
summary:
  en: "A selective program in a field completely new to me. I worked with real genomic data, DNA sequences, gene expression and proteins, from public and Saudi-specific datasets, cleaning and normalizing it with Python and pandas, then comparing organisms through correlation analysis. It taught me to learn an unfamiliar domain fast and to let messy data speak only after it is properly prepared."
  ar: "برنامج تنافسي في مجال جديد كليًا بالنسبة لي: تعاملت مع بيانات جينومية حقيقية من تسلسلات الحمض النووي والتعبير الجيني والبروتينات، من مجموعات بيانات عامة وأخرى خاصة بالمملكة، فنظّفتها وطبّعتها باستخدام Python وpandas، ثم قارنت بين الكائنات الحية عبر تحليل الارتباط. وتعلّمت منه كيف أستوعب مجالًا غير مألوف بسرعة، وألّا أستنطق البيانات الفوضوية قبل تهيئتها كما ينبغي."
