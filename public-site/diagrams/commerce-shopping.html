API", "PostgreSQL": "PostgreSQL", "Application data store": "\u0645\u062e\u0632\u0646 \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u062a\u0637\u0628\u064a\u0642", "ChromaDB VM": "\u062c\u0647\u0627\u0632 ChromaDB", "Vector retrieval \u00b7 port 8000": "\u0627\u0633\u062a\u0631\u062c\u0627\u0639 \u0627\u0644\u0645\u062a\u062c\u0647\u0627\u062a \u0639\u0628\u0631 \u0627\u0644\u0645\u0646\u0641\u0630 8000", "Blob + Key Vault": "Blob \u0648Key Vault", "PDF documents + secrets": "\u0645\u0644\u0641\u0627\u062a PDF \u0648\u0627\u0644\u0623\u0633\u0631\u0627\u0631", "GitHub Actions": "GitHub Actions", "Terraform deployment": "\u0627\u0644\u0646\u0634\u0631 \u0639\u0628\u0631 Terraform", "Azure Bastion": "Azure Bastion", "Administrative access": "\u0627\u0644\u0648\u0635\u0648\u0644 \u0627\u0644\u0625\u062f\u0627\u0631\u064a", "Azure container deployment": "\u0627\u0644\u0646\u0634\u0631 \u0628\u0627\u0644\u062d\u0627\u0648\u064a\u0627\u062a \u0639\u0644\u0649 Azure", "Container deployment variant from the presentation": "\u0646\u0633\u062e\u0629 \u0627\u0644\u0646\u0634\u0631 \u0628\u0627\u0644\u062d\u0627\u0648\u064a\u0627\u062a \u0645\u0646 \u0627\u0644\u0639\u0631\u0636", "Users / Internet": "\u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645\u0648\u0646 / \u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a", "Application access": "\u0627\u0644\u0648\u0635\u0648\u0644 \u0625\u0644\u0649 \u0627\u0644\u062a\u0637\u0628\u064a\u0642", "VM": "\u062c\u0647\u0627\u0632 \u0627\u0641\u062a\u0631\u0627\u0636\u064a", "Streamlit + ChromaDB": "Streamlit \u0648ChromaDB", "Container Apps": "Container Apps", "Containerized application": "\u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u062f\u0627\u062e\u0644 \u062d\u0627\u0648\u064a\u0629", "Container Registry": "\u0633\u062c\u0644 \u0627\u0644\u062d\u0627\u0648\u064a\u0627\u062a", "Images from GitHub Actions": "\u0635\u0648\u0631 \u0645\u0646 GitHub Actions", "Relational storage": "\u062a\u062e\u0632\u064a\u0646 \u0639\u0644\u0627\u0626\u a \u0645\u0633\u0627\u0639\u062f \u0627\u0644\u0645\u062d\u0627\u062f\u062b\u0629.", "TrackFlow \u2014 Bootcamp Management Platform": "TrackFlow \u2014 \u0645\u0646\u0635\u0629 \u0625\u062f\u0627\u0631\u0629 \u0627\u0644\u0645\u0639\u0633\u0643\u0631\u0627\u062a", "I led a three-person team and implemented the frontend, backend, and database. TrackFlow connects cohort administration, teaching, student learning, and progress monitoring in one application.": "\u0642\u062f\u062a \u0641\u0631\u064a\u0642\u064b\u0627 \u0645\u0646 \u062b\u0644\u0627\u062b\u0629 \u0623\u0639\u0636\u0627\u0621 \u0648\u0646\u0641\u0630\u062a \u0627\u0644\u0648\u0627\u062c\u0647\u0629 \u0627\u0644\u0623\u0645\u0627\u0645\u064a\u0629 \u0648\u0627\u0644\u062e\u0644\u0641\u064a\u0629 \u0648\u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a. \u064a\u0631\u0628\u0637 TrackFlow \u0625\u062f\u0627\u0631\u0629 \u0627\u0644\u062f\u0641\u0639\u0627\u062a \u0648\u0627\u0644\u062a\u062f\u0631\u064a\u0633 \u0648\u062a\u0639\u0644\u0645 \u0627\u0644\u0637\u0644\u0627\u0628 \u0648\u0645\u062a\u0627\u0628\u0639\u0629 \u0627\u0644\u062a\u0642\u062f\u0645 \u0641\u064a \u062a\u0637\u0628\u064a\u0642 \u0648\u0627\u062d\u062f.", "Architecture traced from the submitted code. Animated paths explain interactions; they do not represent live traffic. Screenshots show demo data, not adoption figures.": "\u0627\u0644\u0628\u0646\u064a\u0629 \u0645\u0633\u062a\u0646\u062f\u0629 \u0625\u0644\u0649 \u0627\u0644\u0643\u0648\u062f \u0627\u0644\u0645\u0631\u0641\u0642. \u062a\u0648\u0636\u062d \u0627\u0644\u062d\u0631\u0643\u0629 \u0627\u0644\u062a\u0641\u0627\u0639\u0644\u0627\u062a \u0648\u0644\u0627 \u062a\u0645\u062b\u0644 \u062a\u0634\u063a\u064a\u0644\u064b\u0627 \u062d\u064a\u064b\u0627. \u062a\u0639\u0631\u0636 \u0627\u0644\u0644\u0642\u0637\u0627\u062a \u0628\u064a\u0627\u0646\u0627\u062a \u062a\u062c\u0631\u064a\u0628\u064a\u0629 \u0648\u0644\u064a\u0633\u062a \u0623\u0631\u0642\u0627\u0645 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0641\u0639\u0644\u064a\u0629.", "Application architecture": "\u0628\u0646\u064a\u0629 \u0627\u0644\u062a\u0637\u0628\u064a\u0642", "Four user roles share a React interface backed by FastAPI. JWT identity and backend permission helpers govern access. Feature modules use SQLAlchemy and the supplied SQLite database; uploads are served by FastAPI.": "\u062a\u0633\u062a\u062e\u062f\u0645 \u0623\u0631\u0628\u0639\u0629 \u0623\u062f\u0648\u0627\u0631 \u0648\u0627\u062c\u0647\u0629 React \u0645\u0639 \u062e\u0644\u0641\u064a\u0629 FastAPI. \u062a\u062a\u062d\u0643\u0645 \u0647\u0648\u064a\u0629 JWT \u0648\u0623\u062f\u0648\u0627\u062a \u0635\u0644\u0627\u062d\u064a\u0627\u062a \u0627\u0644\u062e\u0644\u0641\u064a\u0629 \u0641\u064a \u0627\u0644\u0648\u0635\u0648\u0644\u060c \u0648\u062a\u0633\u062a\u062e\u062f\u0645 \u0627\u0644\u0648\u062d\u062f\u0627\u062a SQLAlchemy \u0648\u0642\u0627\u0639\u062f\u0629 SQLite \u0627\u0644\u0645\u0631\u0641\u0642\u0629\u060c \u0645\u0639 \u062a\u0642\u062f\u064a\u0645 \u0627\u0644\u0645\u0644\u0641\u0627\u062a \u0639\u0628\u0631 FastAPI.", "Instructors publish cohort content, students complete learning activities, and staff review progress assembled from articles, quizzes, assignments, and attendance. The submitted code uses bulk queries for cohort progress instead of separate queries per student.": "\u064a\u0646\u0634\u0631 \u0627\u0644\u0645\u062f\u0631\u0628\u0648\u0646 \u0645\u062d\u062a\u0648\u0649 \u0627\u0644\u062f\u0641\u0639\u0627\u062a \u0648\u064a\u0643\u0645\u0644 \u0627\u0644\u0637\u0644\u0627\u0628 \u0623\u0646\u0634\u0637\u0629 \u0627\u0644\u062a\u0639\u0644\u0645\u060c \u062b\u0645 \u064a\u0631\u0627\u062c\u0639 \u0627\u0644\u0641\u0631\u064a\u0642 \u0627\u0644\u062a\u0642\u062f\u0645 \u0627\u0644\u0645\u062c\u0645\u0639 \u0645\u0646 \u0627\u0644\u0645\u0642\u0627\u0644\u0627\u062a \u0648\u0627\u0644\u0627\u062e\u062a\u0628\u0627\u0631\u0627\u062a \u0648\u0627\u0644\u0648\u0627\u062c\u0628\u0627\u062a \u0648\u0627\u0644\u062d\u0636\u0648\u0631. \u064a\u0633\u062a\u062e\u062f\u0645 \u0627\u0644\u0643\u0648\u062f \u0627\u0633\u062a\u0639\u0644\u0627\u0645\u0627\u062a \u0645\u062c\u0645\u0639\u0629 \u0644\u062a\u0642\u062f\u0645 \u0627\u0644\u062f\u0641\u0639\u0629 \u0628\u062f\u0644\u064b\u0627 \u0645\u0646 \u0627\u0633\u062a\u0639\u0644\u0627\u0645\u0627\u062a \u0645\u0646\u0641\u0635\u0644\u0629 \u0644\u0643\u0644 \u0637\u0627\u0644\u0628.", "Availability templates generate slots. Booking checks cover student role, cohort, active bookings, blocks, and occupied slots. Session states include completion, cancellation, and no-shows.": "\u062a\u0648\u0644\u062f \u0642\u0648\u0627\u0644\u0628 \u0627\u0644\u062a\u0648\u0641\u0631 \u0627\u0644\u0645\u0648\u0627\u0639\u064a\u062f. \u062a\u0634\u0645\u0644 \u0641\u062d\u0648\u0635 \u0627\u0644\u062d\u062c\u0632 \u062f\u0648\u0631 \u0627\u0644\u0637\u0627\u0644\u0628 \u0648\u0627\u0644\u062f\u0641\u0639\u0629 \u0648\u0627\u0644\u062d\u062c\u0648\u0632\u0627\u062a \u0627\u0644\u0646\u0634\u0637\u0629 \u0648\u0627\u0644\u062d\u0638\u0631 \u0648\u0627\u0644\u0645\u0648\u0627\u0639\u064a\u062f \u0627\u0644\u0645\u0634\u063a\u0648\u0644\u0629. \u062a\u0634\u0645\u0644 \u0627\u0644\u062d\u0627\u0644\u0627\u062a \u0627\u0644\u0625\u0643\u0645\u0627\u0644 \u0648\u0627\u0644\u0625\u0644\u063a\u0627\u0621 \u0648\u0627\u0644\u063a\u064a\u0627\u0628.", "Project images and diagrams": "\u0635\u0648\u0631 \u0627\u0644\u0645\u0634\u0631\u0648\u0639 \u0648\u0645\u062e\u0637\u0637\u0627\u062a\u0647", "Admin dashboard \u2014 demo data": "\u0644\u0648\u062d\u0629 \u0627\u0644\u0625\u062f\u0627\u0631\u0629 \u2014 \u0628\u064a\u0627\u0646\u0627\u062a \u062a\u062c\u0631\u064a\u0628\u064a\u0629", "Instructor learning content \u2014 demo": "\u0645\u062d\u062a\u0648\u0649 \u0627\u0644\u062a\u0639\u0644\u0645 \u0644\u0644\u0645\u062f\u0631\u0628 \u2014 \u0639\u0631\u0636 \u062a\u062c\u0631\u064a\u0628\u064a", "Azure RAG Chatbot": "\u0645\u0633\u0627\u0639\u062f RAG \u0639\u0644\u0649 Azure", "A PDF-based assistant with Streamlit, FastAPI, and ChromaDB retrieval, deployed on Azure using Terraform and GitHub Actions. I implemented the application, deployment, pipelines, and the related OpenMetadata workstream.": "\u0645\u0633\u0627\u0639\u062f \u064a\u0639\u062a\u0645\u062f \u0639\u0644\u0649 \u0645\u0644\u0641\u0627\u062a PDF \u0628\u0627\u0633\u062a\u062e\u062f\u0627\u0645 Streamlit \u0648FastAPI \u0648\u0627\u0633\u062a\u0631\u062c\u0627\u0639 ChromaDB\u060c \u0648\u0646\u0634\u0631 \u0639\u0644\u0649 Azure \u0628\u0627\u0633\u062a\u062e\u062f\u0627\u0645 Terraform \u0648GitHub Actions. \u0646\u0641\u0630\u062a \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0648\u0627\u0644\u0646\u0634\u0631 \u0648\u0627\u0644\u0645\u0633\u0627\u0631\u0627\u062a \u0648\u0645\u0633\u0627\u0631 OpenMetadata \u0627\u0644\u0645\u0631\u062a\u0628\u0637.", "VMSS and Container Apps diagrams follow the supplied slides. AKS deployment and use of both PostgreSQL and Cosmos DB were confirmed separately by the owner; exact AKS topology is not shown.": "\u062a\u062a\u0628\u0639 \u0645\u062e\u0637\u0637\u0627\u062a VMSS \u0648Container Apps \u0627\u0644\u0639\u0631\u0648\u0636 \u0627\u0644\u0645\u0631\u0641\u0642\u0629. \u0623\u0643\u062f \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0628\u0635\u0648\u0631\u0629 \u0645\u0646\u0641\u0635\u0644\u0629 \u0627\u0644\u0646\u0634\u0631 \u0639\u0644\u0649 AKS \u0648\u0627\u0633\u062a\u062e\u062f\u0627\u0645 PostgreSQL \u0648Cosmos DB\u060c \u0648\u0644\u0645 \u062a\u064f\u0639\u0631\u0636 \u062a\u0641\u0627\u0635\u064a\u0644 \u0628\u0646\u064a\u0629 AKS.", "VM Scale Set deployment": "\u0627\u0644\u0646\u0634\u0631 \u0639\u0628\u0631 VM Scale Sets", "Application Gateway routes requests to Streamlit and FastAPI on VM Scale Sets. The application connects to PostgreSQL, Blob Storage, Key Vault, and ChromaDB on a separate VM. The presentation documents fixing ChromaDB network binding so the VMSS instances could reach it.": "\u064a\u0648\u062c\u0647 Application Gateway \u0627\u0644\u0637\u0644\u0628\u0627\u062a \u0625\u0644\u0649 Streamlit \u0648FastAPI \u0639\u0644\u0649 VM Scale Sets. \u064a\u062a\u0635\u0644 \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0628\u0640PostgreSQL \u0648Blob Storage \u0648Key Vault \u0648ChromaDB \u0639\u0644\u0649 \u062c\u0647\u0627\u0632 \u0645\u0646\u0641\u0635\u0644. \u064a\u0648\u062b\u0642 \u0627\u0644\u0639\u0631\u0636 \u0645\u0639\u0627\u0644\u062c\u0629 \u0631\u0628\u0637 ChromaDB \u0628\u0627\u0644\u0634\u0628\u0643\u0629 \u0644\u062a\u0635\u0644 \u0625\u0644\u064a\u0647 \u0645\u062b\u064a\u0644\u0627\u062a VMSS.", "Container deployment variant": "\u0646\u0633\u062e\u0629 \u0627\u0644\u0646\u0634\u0631 \u0628\u0627\u0644\u062d\u0627\u0648\u064a\u0627\u062a", "The second design places the containerized application in Azure Container Apps, with Container Registry and GitHub Actions for delivery. The slide places Streamlit and ChromaDB on a VM and includes PostgreSQL, Blob Storage, Key Vault, and Cosmos DB.": "\u064a\u0636\u0639 \u0627\u0644\u062a\u0635\u0645\u064a\u0645 \u0627\u0644\u062b\u0627\u0646\u064a \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u062f\u0627\u062e\u0644 Azure Container Apps\u060c \u0645\u0639 Container Registry \u0648GitHub Actions \u0644\u0644\u062a\u0633\u0644\u064a\u0645. \u064a\u0636\u0639 \u0627\u0644\u0639\u0631\u0636 Streamlit \u0648ChromaDB \u0639\u0644\u0649 \u062c\u0647\u0627\u0632 \u0627\u0641\u062a\u0631\u0627\u0636\u064a \u0648\u064a\u0636\u0645 PostgreSQL \u0648Blob Storage \u0648Key Vault \u0648Cosmos DB.", "The governance presentation describes an Azure VM running OpenMetadata through Docker Compose with MySQL and SSH-key access. It belongs within this project, but the documents do not specify a direct retrieval integration.": "\u064a\u0635\u0641 \u0639\u0631\u0636 \u0627\u0644\u062d\u0648\u0643\u0645\u0629 \u062c\u0647\u0627\u0632 Azure \u0627\u0641\u062a\u0631\u0627\u0636\u064a\u064b\u0627 \u064a\u0634\u063a\u0644 OpenMetadata \u0639\u0628\u0631 Docker Compose \u0645\u0639 MySQL \u0648\u0648\u0635\u0648\u0644 \u0628\u0645\u0641\u062a\u0627\u062d SSH. \u064a\u0642\u0639 \u0647\u0630\u0627 \u0627\u0644\u0645\u0633\u0627\u0631 \u0636\u0645\u0646 \u0627\u0644\u0645\u0634\u0631\u0648\u0639\u060c \u0644\u0643\u0646 \u0627\u0644\u0645\u0633\u062a\u0646\u062f\u0627\u062a \u0644\u0627 \u062a\u062d\u062f\u062f \u062a\u0643\u0627\u0645\u0644\u064b\u0627 \u0645\u0628\u0627\u0634\u0631\u064b\u0627 \u0645\u0639 \u0627\u0644\u0627\u0633\u062a\u0631\u062c\u0627\u0639.", "Original VM deployment diagram": "\u0645\u062e\u0637\u0637 \u0627\u0644\u0646\u0634\u0631 \u0627\u0644\u0623\u0635\u0644\u064a \u0628\u0627\u0644\u0623\u062c\u0647\u0632\u0629 \u0627\u0644\u0627\u0641\u062a\u0631\u0627\u0636\u064a\u0629", "Original container deployment diagram": "\u0645\u062e\u0637\u0637 \u0627\u0644\u0646\u0634\u0631 \u0627\u0644\u0623\u0635\u0644\u064a \u0628\u0627\u0644\u062d\u0627\u0648\u064a\u0627\u062a", "OpenMetadata deployment steps": "\u062e\u0637\u0648\u0627\u062a \u0646\u0634\u0631 OpenMetadata", "Django store architecture": "\u0628\u0646\u064a\u0629 \u0645\u062a\u062c\u0631 Django", "One Django application \u00b7 shared models": "\u062a\u0637\u0628\u064a\u0642 Django \u0648\u0627\u062d\u062f \u0648\u0646\u0645\u0627\u0630\u062c \u0645\u0634\u062a\u0631\u0643\u0629", "Shoppers": "\u0627\u0644\u0645\u062a\u0633\u0648\u0642\u0648\u0646", "Browse \u00b7 sign in \u00b7 shop": "\u062a\u0635\u0641\u062d \u0648\u062f\u062e\u0648\u0644 \u0648\u062a\u0633\u0648\u0642", "Store staff": "\u0641\u0631\u064a\u0642 \u0627\u0644\u0645\u062a\u062c\u0631", "Manage daily operations": "\u0625\u062f\u0627\u0631\u0629 \u0627\u0644\u0639\u0645\u0644\u064a\u0627\u062a \u0627\u0644\u064a\u0648\u0645\u064a\u0629", "Storefront templates": "\u0642\u0648\u0627\u0644\u0628 \u0648\u0627\u062c\u0647\u0629 \u0627\u0644\u0645\u062a\u062c\u0631", "HTML \u00b7 CSS \u00b7 Bootstr
